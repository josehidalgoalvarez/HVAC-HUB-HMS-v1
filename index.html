
<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HVACHome Operations</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0077B6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HVACHome">
    <meta name="application-name" content="HVACHome">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png">
    <link rel="manifest" href="/manifest.webmanifest">
    
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0077b6", // Blue
                        "brand-red": "#D95B43",
                        "brand-orange": "#F38630",
                        "brand-black": "#2A363B",
                        "brand-green": "#E0E4CC",
                        "background-light": "#F8F9F3", // Creamish white based on E0E4CC
                        "background-dark": "#2A363B",
                        "card-light": "#ffffff",
                        "card-dark": "#364147",
                        "text-main-light": "#2A363B",
                        "text-main-dark": "#E0E4CC",
                        "text-sub-light": "#546a7a",
                        "text-sub-dark": "#a0b3b0",
                    },
                    fontFamily: {
                        "display": ["Epilogue", "sans-serif"],
                        "body": ["Public Sans", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        "ethereal": "0 8px 40px -10px rgba(0, 0, 0, 0.08)",
                        "floating": "0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)",
                    }
                },
            },
        }
    </script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 0px);
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .pl-safe {
            padding-left: env(safe-area-inset-left, 0px);
        }
        .pr-safe {
            padding-right: env(safe-area-inset-right, 0px);
        }
        .font-variation-settings-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom transitions for color changes */
        * {
            transition-property: background-color, border-color, color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }
    </style>
<script type="importmap">

  }
}
</script>
